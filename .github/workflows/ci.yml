name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            security/requirements-audit.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Backend unit and integration tests
        run: python -m unittest discover -s backend/tests -v
      - name: Install security tools
        run: python -m pip install -r security/requirements-audit.txt
      - name: Check medium and high severity source findings
        run: python -m bandit -r backend agent-hooks mcp-server -x backend/tests --severity-level medium
      - name: Audit application and test dependencies
        run: python -m pip_audit -r requirements-dev.txt
      - name: Frontend unit tests
        working-directory: frontend
        run: node --test tests/*.test.js

  docker:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: reply-assistant-ci
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the application
        run: docker compose up --build --wait --wait-timeout 90
      - name: Verify the running application
        run: python3 ops/smoke_test.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Clean up temporary CI containers and data
        if: always()
        run: docker compose down --volumes --remove-orphans
